<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSR 라벨 파일럿</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2e333b; --fg:#e6e8eb; --dim:#9aa3ad; --ok:#3fb950; --no:#f0605a; --warn:#d29922; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, "Malgun Gothic", sans-serif; }
  .wrap { display:grid; grid-template-columns:minmax(0,1fr) 440px; height:100vh; }
  iframe { width:100%; height:100%; border:0; border-right:1px solid var(--line); background:#000; }
  .side { overflow:auto; padding:12px 14px 40px; background:var(--panel); }
  .bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  button, select, input[type=text], textarea { background:#262a31; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  h2 { font-size:13px; color:var(--dim); margin:14px 0 6px; font-weight:600; letter-spacing:.02em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:2px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  td:first-child { color:var(--dim); width:46%; }
  .miss { color:var(--warn); }
  .chip { display:inline-block; padding:1px 7px; border-radius:10px; background:#262a31; border:1px solid var(--line); font-size:12px; margin:1px 2px 1px 0; }
  .tac { display:grid; grid-template-columns:1fr auto auto; gap:4px 6px; align-items:center; margin:2px 0; }
  .tac .name small { color:var(--dim); }
  .tac.masked .name { color:var(--dim); }
  .tog { min-width:52px; }
  .tog.on.acc { background:var(--ok); border-color:var(--ok); color:#000; }
  .tog.on.forb { background:var(--no); border-color:var(--no); color:#000; }
  .after { border:1px dashed var(--warn); border-radius:8px; padding:8px; margin-top:8px; }
  .note { color:var(--dim); font-size:12px; }
  .ev label { display:inline-block; margin:1px 8px 1px 0; font-size:12px; }
  textarea { width:100%; min-height:48px; }
  .msg { margin-top:8px; min-height:1.4em; }
  .msg.err { color:var(--no); } .msg.ok { color:var(--ok); }
  .prog { color:var(--dim); font-size:12px; }
  @media (max-width: 1000px) { .wrap { grid-template-columns:1fr; height:auto; } iframe { height:75vh; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div class="wrap">
  <iframe id="radar" src="/radar" title="레이더 재생"></iframe>
  <div class="side">
    <div class="bar">
      <input id="who" type="text" placeholder="라벨러 ID" size="10">
      <button id="prev">◀ 이전</button>
      <select id="pick"></select>
      <button id="next">다음 ▶</button>
      <span class="prog" id="prog"></span>
    </div>
    <div class="bar">
      <button id="toD">결정 시점으로</button>
      <span class="note">타임라인의 마커 = 결정 시점. 왼쪽 재생은 결정 시점까지만 (봇 로그 줄 없음)</span>
    </div>

    <h2>장면</h2>
    <table id="meta"></table>

    <h2>결정 시점 관측 (모델 입력)</h2>
    <table id="obs"></table>

    <h2>직전 3초 맥락</h2>
    <div id="ctx" class="note"></div>

    <h2>관측 누락</h2>
    <div id="missing" class="note"></div>

    <h2>전술 — 허용 / 금지 (둘 다 아니면 중립)</h2>
    <div class="note">회색 = 그 시점 규칙상 후보가 아님. 그래도 고를 수 있음(규칙과 다른 판단으로 기록됨).</div>
    <div id="tactics"></div>
    <div class="bar" style="margin-top:6px">
      <span class="note">가장 좋은 것(선택):</span><select id="best"><option value="">—</option></select>
    </div>

    <h2>판단 불가</h2>
    <label><input type="checkbox" id="unsure"> 판단할 수 없음</label>
    <select id="unsureWhy">
      <option value="">이유…</option><option>정보 부족</option><option>화면으로 안 보임</option><option>전술 정의가 애매</option><option>기타</option>
    </select>

    <h2>근거</h2>
    <textarea id="why" maxlength="400" placeholder="짧은 근거 (예: 방패병이 3000을 0.7초째 휘두르는 중, 정면 1 m)"></textarea>
    <div class="note">근거가 된 관측값:</div>
    <div id="evidence" class="ev"></div>
    <textarea id="defnote" maxlength="400" placeholder="(선택) 전술 정의가 모호했다면 무엇이 — 예: '거리 유지'와 '막기'를 같이 하는 경우"></textarea>

    <div class="bar" style="margin-top:10px">
      <button class="primary" id="save">저장</button>
      <button id="showAfter">이후 행동·결과 보기</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="after"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let scenes = [], idx = 0, cur = null, t_open = 0, sawAfter = false, state = {};
try { $("who").value = localStorage.getItem("labeler") || ""; } catch (e) {}
$("who").onchange = () => { try { localStorage.setItem("labeler", $("who").value.trim()); } catch (e) {} listScenes(); };

const OBS_KO = {my_hp_pct:"내 HP", my_stamina_pct:"내 SP", target_kind:"목표 종류", target_npc:"목표 npc", target_state:"목표 상태",
  target_anim:"목표 애니", target_swing_age_s:"휘두른 지 (s)", target_hp_pct:"목표 HP", distance_m:"거리 (m)", height_diff_m:"높이 차 (m)",
  weapon_reach_m:"무기 거리 (m)", in_reach:"닿음", facing_error_deg:"내 정면과 목표 각 (°)", target_facing_me_deg:"목표 정면과 나 각 (°)",
  others_within_4_5m:"4.5 m 안 다른 적", other_swinging_near:"2.5 m 안 다른 적 휘두름", estus_left:"에스트 남음", fighting_style:"스타일",
  estus_wanted:"에스트 원함(HP 60 % 아래)"};
const PCT = new Set(["my_hp_pct", "my_stamina_pct", "target_hp_pct"]);
const fmt = (v, k) => v === null || v === undefined ? "—" : typeof v === "boolean" ? (v ? "예" : "아니오") : PCT.has(k) ? (v*100).toFixed(0) + " %" : String(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function listScenes() {
  const who = encodeURIComponent($("who").value.trim());
  scenes = await (await fetch(`/scenes?labeler=${who}`, {cache:"no-store"})).json();
  $("pick").innerHTML = scenes.map((s, i) => `<option value="${i}">${s.labeled ? "✓ " : ""}${i+1}. ${esc(s.scene_id)}</option>`).join("");
  $("pick").value = idx;
  $("prog").textContent = `${scenes.filter(s => s.labeled).length}/${scenes.length} 저장됨`;
}

async function openScene(i, phase = "pre") {
  idx = Math.max(0, Math.min(scenes.length - 1, i));
  $("pick").value = idx;
  const who = encodeURIComponent($("who").value.trim());
  const r = await (await fetch(`/scene?id=${scenes[idx].scene_id}&phase=${phase}&labeler=${who}`, {cache:"no-store"})).json();
  cur = r;
  if (phase === "pre") { t_open = performance.now(); sawAfter = false; $("after").innerHTML = ""; render(r); }
  else showAfter(r.scene.after);
}

function render(r) {
  const s = r.scene;
  $("meta").innerHTML = [["출처", s.source === "bot" ? "봇 실행" : "사람 시범"], ["실행", s.run_id], ["싸움", s.fight_id],
    ["구역", s.segment || "구역 미정"], ["적", `${s.enemy.kind} (${s.enemy.npc})`], ["장면을 고른 사건", s.event],
    ["코드 커밋", s.code_commit ? s.code_commit + (s.code_commit_approx ? " (실행 시각 기준 추정)" : "") : "—"]]
    .map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("");
  $("obs").innerHTML = Object.entries(s.obs).map(([k, v]) =>
    `<tr><td>${OBS_KO[k] || k}</td><td class="${v === null ? "miss" : ""}">${esc(fmt(v, k))}${s.obs_notes && s.obs_notes[k] ? ` <span class="note">(${esc(s.obs_notes[k])})</span>` : ""}</td></tr>`).join("");
  const c = s.context;
  const did = (c.actor_did || []).map(x => typeof x[1] === "string" ? `${x[0]}s ${x[1]}` : `${x[0]}s ${Object.entries(x[1]).map(([k, n]) => (r.tactics_ko[k] || k) + "×" + n).join(" ")}`);
  $("ctx").innerHTML = `목표 상태: ${(c.target_states || []).map(x => `${x[0]}s ${esc(x[1])}`).join(" → ") || "—"}<br>` +
    `내 HP 변화: ${c.my_hp_change ?? "—"}<br>${s.source === "bot" ? "봇이 한 것" : "사람이 누른 버튼"}: ${did.map(esc).join(" · ") || "없음"}`;
  $("missing").innerHTML = Object.entries(s.missing).map(([k, v]) => `<div><span class="miss">${OBS_KO[k] || k}</span>: ${esc(v)}</div>`).join("");
  const prev = r.label || {};
  state = {};
  (prev.acceptable || []).forEach(t => state[t] = "acc");
  (prev.forbidden || []).forEach(t => state[t] = "forb");
  $("tactics").innerHTML = Object.keys(r.tactics).map(t => {
    const masked = !s.allowed.includes(t);
    return `<div class="tac ${masked ? "masked" : ""}" title="${esc(r.tactics[t])}"><span class="name">${esc(r.tactics_ko[t] || t)} <small>${t}${masked ? " · 후보 아님" : ""}</small></span>
      <button class="tog acc" data-t="${t}" data-v="acc">허용</button><button class="tog forb" data-t="${t}" data-v="forb">금지</button></div>`;
  }).join("");
  document.querySelectorAll(".tog").forEach(b => b.onclick = () => { const t = b.dataset.t; state[t] = state[t] === b.dataset.v ? undefined : b.dataset.v; paint(); });
  $("best").innerHTML = `<option value="">—</option>` + Object.keys(r.tactics).map(t => `<option value="${t}">${esc(r.tactics_ko[t] || t)}</option>`).join("");
  $("best").value = prev.best || "";
  $("unsure").checked = !!prev.unsure; $("unsureWhy").value = prev.unsure_reason || "";
  $("why").value = prev.rationale || ""; $("defnote").value = prev.definition_note || "";
  const evKeys = Object.keys(s.obs).concat(Object.keys(s.context).map(k => "context." + k));
  $("evidence").innerHTML = evKeys.map(k => `<label><input type="checkbox" value="${k}" ${(prev.evidence || []).includes(k) ? "checked" : ""}> ${esc(OBS_KO[k] || k)}</label>`).join("");
  $("msg").textContent = prev.scene_id ? `이전 저장 있음 (${prev.labeled_at}) — 다시 저장하면 새 줄로 덮어씀` : "";
  $("msg").className = "msg";
  paint();
}

function paint() {
  document.querySelectorAll(".tog").forEach(b => b.classList.toggle("on", state[b.dataset.t] === b.dataset.v));
}

function showAfter(a) {
  const ko = cur.tactics_ko;
  const act = a.bot_action ? `봇이 한 것 (다음 1 s): ${Object.entries(a.bot_action).map(([k, n]) => (ko[k] || k) + "×" + n).join(" ") || "—"} <span class="note">(${esc(a.bot_acts_raw || "")})</span>`
    : `사람이 누른 버튼 (다음 1.5 s): ${(a.human_pressed || []).map(x => `${x[0]}s ${x[1]}`).join(" · ") || "없음"}`;
  $("after").innerHTML = `<div class="after"><b>이후 (참고 — 모델 입력 아님, 이 장면 라벨에 '봤음'으로 기록)</b><br>${act}<br>
    내 HP 변화 1.5 s / 3 s: ${a.my_hp_change_1_5s ?? "—"} / ${a.my_hp_change_3s ?? "—"} · 목표 HP 변화 3 s: ${a.target_hp_change_3s ?? "—"}<br>
    싸움 결과: ${esc(a.fight_result)}<br><span class="note">왼쪽 재생이 결정 시점 뒤 4초까지(봇 로그 줄 포함)로 바뀜</span></div>`;
}

async function save() {
  const who = $("who").value.trim();
  if (!who) { $("msg").textContent = "라벨러 ID를 넣어 주세요"; $("msg").className = "msg err"; return; }
  const body = {scene_id: cur.scene.scene_id, labeler_id: who, duration_s: (performance.now() - t_open) / 1000, saw_after: sawAfter,
    acceptable: Object.keys(state).filter(t => state[t] === "acc"), forbidden: Object.keys(state).filter(t => state[t] === "forb"),
    best: $("best").value || null, unsure: $("unsure").checked, unsure_reason: $("unsure").checked ? $("unsureWhy").value : null,
    rationale: $("why").value.trim(), evidence: [...document.querySelectorAll("#evidence input:checked")].map(x => x.value),
    definition_note: $("defnote").value.trim()};
  const r = await fetch("/label", {method:"POST", headers:{"Content-Type":"application/json", "X-Radar":"1"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({ok:false, errors:["응답 없음"]}));
  $("msg").textContent = j.ok ? `저장됨 (${body.duration_s.toFixed(0)} s)` : "저장 안 됨: " + (j.errors || []).join(", ");
  $("msg").className = "msg " + (j.ok ? "ok" : "err");
  if (j.ok) { await listScenes(); }
}

$("save").onclick = save;
$("showAfter").onclick = async () => { sawAfter = true; await openScene(idx, "full"); };
$("prev").onclick = () => openScene(idx - 1);
$("next").onclick = () => openScene(idx + 1);
$("pick").onchange = () => openScene(+$("pick").value);
$("toD").onclick = () => { if (cur) fetch(`/replay?cmd=seek&v=${cur.seek_rel.toFixed(2)}`); };
(async () => { await listScenes(); if (scenes.length) await openScene(0); })();
</script>
</body>
</html>
